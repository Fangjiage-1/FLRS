# 128-step FLRS sweep: boundary behavior and rollback-strength sensitivity.
- sampling_method: flrs
  num_sampling_steps: [128]
  cfgs: [1]
  rollback_gamma_start: 2.0
  rollback_gamma_end: 0.0
  rollback_power: 1
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal

