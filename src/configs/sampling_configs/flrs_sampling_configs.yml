# FLRS rollback-strength sweep.
# The scheduled gamma controls the full native rollback operator.

- sampling_method: flrs
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  rollback_gamma_start: 1.5
  rollback_gamma_end: 0.0
  time_schedule: logit_normal

- sampling_method: flrs
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  rollback_gamma_start: 2.0
  rollback_gamma_end: 0.0
  time_schedule: logit_normal

