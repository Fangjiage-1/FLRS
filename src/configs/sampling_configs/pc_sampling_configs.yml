# PC: Predictor (exp) + Corrector (noise injection + denoise)
# Each step costs 2 NFEs.

- sampling_method: pc
  num_sampling_steps: [8]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 0.3
  time_schedule: logit_normal

