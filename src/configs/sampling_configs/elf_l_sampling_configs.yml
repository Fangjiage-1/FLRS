# ELF-L evaluation: SDE baselines + sde_anneal best configs

# SDE baselines
- sampling_method: sde
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 1.5
  time_schedule: logit_normal

- sampling_method: sde
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 1.0
  time_schedule: logit_normal

# sde_anneal best configs (from ELF-B experiments)
- sampling_method: sde_anneal
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 2.0
  sde_gamma_end: 0.0
  time_schedule: logit_normal

- sampling_method: sde_anneal
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 2.0
  sde_gamma_end: 0.0
  time_schedule: logit_normal

- sampling_method: sde_anneal
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 1.5
  sde_gamma_end: 0.0
  sde_anneal_power: 2.0
  time_schedule: logit_normal
