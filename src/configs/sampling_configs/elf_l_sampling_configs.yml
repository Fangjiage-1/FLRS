# ELF-L evaluation: SDE baselines and selected FLRS configurations.

# SDE baselines
- sampling_method: sde
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 1.5
  time_schedule: logit_normal

- sampling_method: sde
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 1.0
  time_schedule: logit_normal

# Selected FLRS configurations (from ELF-B experiments)
- sampling_method: flrs
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  rollback_gamma_start: 2.0
  rollback_gamma_end: 0.0
  time_schedule: logit_normal

- sampling_method: flrs
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  rollback_gamma_start: 2.0
  rollback_gamma_end: 0.0
  time_schedule: logit_normal

- sampling_method: flrs
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  rollback_gamma_start: 1.5
  rollback_gamma_end: 0.0
  rollback_power: 2.0
  time_schedule: logit_normal
