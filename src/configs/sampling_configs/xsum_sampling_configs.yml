# XSum summarization: ODE/SDE/FLRS plus Heun/exp deterministic solvers.
# CFG=2 is standard for conditional generation

- sampling_method: ode
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  time_schedule: logit_normal

- sampling_method: heun
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  time_schedule: logit_normal

- sampling_method: exp
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  time_schedule: logit_normal

- sampling_method: sde
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  sde_gamma: 1.0
  time_schedule: logit_normal

- sampling_method: flrs
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  rollback_gamma_start: 2.0
  rollback_gamma_end: 0.0
  time_schedule: logit_normal
