- sampling_method: ode
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  time_schedule: logit_normal

- sampling_method: sde_anneal
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  sde_gamma: 2.0
  sde_gamma_end: 0.0
  time_schedule: logit_normal

- sampling_method: sde_anneal
  num_sampling_steps: [32]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  sde_gamma: 2.0
  sde_gamma_end: 0.0
  time_schedule: logit_normal
