# XSum: deterministic solvers (Heun + exp) to compare with ODE baseline

- sampling_method: heun
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  time_schedule: logit_normal

- sampling_method: exp
  num_sampling_steps: [64]
  cfgs: [2]
  self_cond_cfg_scales: [1]
  time_schedule: logit_normal
