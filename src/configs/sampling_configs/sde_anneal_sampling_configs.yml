# SDE with noise annealing — tuning round 2
#  gamma_start: initial noise level (higher = more diversity)
#  gamma_end:   final noise level (0 = clean convergence)
#  anneal_power: 1=linear, 2=quadratic (keeps diversity longer)

- sampling_method: sde_anneal
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 1.5
  sde_gamma_end: 0.0
  time_schedule: logit_normal

- sampling_method: sde_anneal
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 2.0
  sde_gamma_end: 0.0
  time_schedule: logit_normal

- sampling_method: sde_anneal
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 1.5
  sde_gamma_end: 0.0
  sde_anneal_power: 2.0
  time_schedule: logit_normal

- sampling_method: sde_anneal
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  sde_gamma: 2.0
  sde_gamma_end: 0.0
  sde_anneal_power: 2.0
  time_schedule: logit_normal

